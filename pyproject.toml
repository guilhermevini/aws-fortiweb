[project]
name = "aws-fortiweb"
version = "1.0.0"
description = "Keep AWS WAF IP sets in sync with FortiWeb Cloud IP ranges"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["boto3>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "ty>=0.0.18"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
