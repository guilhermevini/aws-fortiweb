[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-fortiweb"
dynamic = ["version"]
description = "Keep AWS WAF IP sets in sync with FortiWeb Cloud IP ranges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Vinicius" }]
requires-python = ">=3.9"
dependencies = ["boto3>=1.26"]
keywords = ["aws", "waf", "wafv2", "fortiweb", "fortinet", "ip-set", "allowlist", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]

[project.urls]
Homepage = "https://github.com/guilhermevini/aws-fortiweb"
Issues = "https://github.com/guilhermevini/aws-fortiweb/issues"
Changelog = "https://github.com/guilhermevini/aws-fortiweb/releases"

[project.scripts]
aws-fortiweb = "aws_fortiweb:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "ty>=0.0.18"]

[tool.hatch.version]
path = "aws_fortiweb.py"

[tool.hatch.build.targets.wheel]
only-include = ["aws_fortiweb.py"]

[tool.hatch.build.targets.sdist]
only-include = ["aws_fortiweb.py", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
