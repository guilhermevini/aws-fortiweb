name: Update FortiWeb IPs

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download IP lists
        run: ./download_ips.sh

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to the IP lists."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: update FortiWeb IP lists"
          git push

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # Re-enabling the workflow through the API resets that timer without creating commits.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow enable update-ips.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
