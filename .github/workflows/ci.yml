name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Ruff (lint)
        run: uv run --locked ruff check --output-format=github .
      - name: Ruff (format)
        run: uv run --locked ruff format --check .
      - name: ty (type check)
        run: uv run --locked ty check
      - name: ShellCheck
        run: shellcheck download_ips.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: uv run --locked pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build sdist and wheel
        run: uv build
      # setup-python has no 3.9 build for the latest Ubuntu, so let uv provide the interpreter
      - name: Install Python 3.9
        run: uv python install 3.9
      # Simulates a server that only has Python and pip: uv is not used from here on
      - name: Install with plain pip and smoke test
        run: |
          "$(uv python find 3.9)" -m venv /tmp/server
          /tmp/server/bin/pip install dist/*.whl
          /tmp/server/bin/aws-fortiweb --help
          /tmp/server/bin/python -m aws_fortiweb --help > /dev/null

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
